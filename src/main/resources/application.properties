spring.application.name=ms-merchant-bill-payments
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

server.error.include-message=never
server.error.include-stacktrace=never
app.security.admin-password=${ADMIN_PASSWORD:admin123}
app.security.wycliffe-password=${WYCLIFFE_PASSWORD:customer123}
app.security.mwimali-password=${MWIMALI_PASSWORD:customer456}
